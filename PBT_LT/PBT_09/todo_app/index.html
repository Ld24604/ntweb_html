<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="app-shell">
        <section class="todo-panel">
            <h1>Todo App</h1>
            <form id="todo-form" class="todo-form" novalidate>
                <input id="todo-input" type="text" placeholder="Add a new todo..." autocomplete="off" />
                <button type="submit">Add</button>
            </form>
            <div class="todo-actions">
                <div class="filters" aria-label="Todo filters">
                    <button type="button" class="filter-btn active" data-filter="all">All</button>
                    <button type="button" class="filter-btn" data-filter="active">Active</button>
                    <button type="button" class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
            </div>
            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
            <div class="status-bar">
                <span id="item-count">0 items left</span>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
