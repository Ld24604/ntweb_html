<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="gallery-shell">
        <section class="gallery-header">
            <div>
                <h1>Infinite Scroll Gallery</h1>
                <p>Scroll down to load more images. Click an image to open the lightbox.</p>
            </div>
        </section>

        <div id="gallery-grid" class="gallery-grid"></div>
        <div id="load-trigger" class="load-trigger">Loading more...</div>
    </main>

    <div id="lightbox" class="lightbox hidden" aria-hidden="true">
        <button id="lightbox-close" class="lightbox-close" aria-label="Close image">✕</button>
        <img id="lightbox-image" alt="Expanded gallery image" />
        <p id="lightbox-caption"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
